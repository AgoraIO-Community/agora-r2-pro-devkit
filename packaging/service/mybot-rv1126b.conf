# Root-owned shell assignments, installed as /etc/mybot-rv1126b.conf (0600).
# The service pins assets to the selected release and keeps the existing data.
export MYBOT_ENABLED='1'
# Supervised deployment selects video unless settings explicitly set video=false.
export RV1126B_VIDEO='1'
export RV1126B_INPUT_DEVICE='auto'
export RV1126B_TOUCH_DEVICE='auto'
export MYBOT_KV_STORE_DIR='/userdata/mybot-rv1126b'
export MYBOT_SYSTEM_WPA_CONFIG='/etc/wpa_supplicant.conf'
export MYBOT_DHCPCD_LEASE_DIR='/run/mybot-network/leases'
export RV1126B_WIFI_INTERFACE=''
export RV1126B_TIME_SYNC_TIMEOUT='30'
# Leave the helper disabled when a system time service is available.
export RV1126B_TIME_SYNC_HELPER=''
