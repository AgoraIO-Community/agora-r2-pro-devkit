pcm.botstation_capture {
    type plug
    slave {
        pcm "hw:0,0"
        format S16_LE
        rate 48000
        channels 2
    }
    hint {
        show on
        description "BotStation 16 kHz mono capture"
    }
}

pcm.botstation_playback {
    type plug
    slave {
        pcm "hw:0,0"
        format S16_LE
        rate 48000
        channels 2
    }
    hint {
        show on
        description "BotStation 16 kHz mono playback"
    }
}
